name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wbb-backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wbb
          POSTGRES_PASSWORD: wbb-dev-password
          POSTGRES_DB: wbb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wbb -d wbb"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      WBB_TEST_PG_ADMIN_URL: postgres://wbb:wbb-dev-password@127.0.0.1:5432/postgres
      # Dedicated per-job service container; the test harness never flushes it.
      WBB_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wbb-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
